name: release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            variant: ""
            linker: cc
            packages: ""
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            variant: "-musl"
            linker: musl-gcc
            packages: musl-tools

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the toolchain of the target
        run: |
          sudo apt-get update
          if [ -n "${{ matrix.packages }}" ]; then
            sudo apt-get install --no-install-recommends ${{ matrix.packages }}
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up the linker and the C compiler of the target
        env:
          TARGET: ${{ matrix.target }}
          LINKER: ${{ matrix.linker }}
        run: |
          # The environment variables of the linker and of the C compiler are named
          # after the target, e.g. CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER.
          suffix=$(echo "$TARGET" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${suffix}_LINKER=${LINKER}" >> "$GITHUB_ENV"
          echo "CC_${suffix}=${LINKER}" >> "$GITHUB_ENV"

      - name: Build the binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package the binary
        id: package
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          name="evans-${version}-linux-${ARCH}${VARIANT}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/evans" "dist/${name}/evans"
          cp README.md "dist/${name}/README.md"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "The package is dist/${name}.tar.gz"

      - name: Check the package
        run: |
          tar -tzf "dist/${{ steps.package.outputs.name }}.tar.gz"
          file "dist/${{ steps.package.outputs.name }}/evans"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.tar.gz
            dist/${{ steps.package.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List the packages
        run: ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/*.sha256 \
              --generate-notes --title "$TAG" --verify-tag
          fi
