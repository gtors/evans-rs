[package]
name = "evans2"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "evans"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
clap = { version = "4.6.8", features = ["derive"] }
dialoguer = "0.12.0"
dirs = "7.0.0"
figment = { version = "0.10.19", features = ["toml", "test", "env"] }
futures = "0.3.34"
http = "1.5.0"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.10.0"
reedline = "0.53.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tonic = { version = "0.14.9", features = ["gzip", "tls-native-roots", "tls-ring"] }
tonic-reflection = "0.14.9"

[build-dependencies]
prost-build = "0.14.6"
protox = "0.10.0"
tonic-build = { version = "0.14.9", features = ["transport"] }
tonic-prost-build = "0.14.9"

[dev-dependencies]
prost = "0.14.6"
tokio-stream = "0.1.19"
tonic-prost = "0.14.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
