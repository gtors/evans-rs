# nfpm configuration for the native packages: deb, rpm and Arch Linux pkg.tar.zst.
#
# The values below are expanded from the environment, so the same file is used
# for every target:
#
#   VERSION  package version, taken from Cargo.toml
#   ARCH     package architecture (amd64, x86_64, ...)
#
# nfpm maps the architecture to the nomenclature of every packager, so `amd64`
# becomes `amd64` in the deb, `x86_64` in the rpm and `x86_64` in the package
# for Arch Linux.
#
# The files of the package are staged in `dist` before nfpm is called:
#
#   dist/bin/evans       the binary
#   dist/share/README.md the documentation
#   dist/share/LICENSE   the license
#
# Usage:
#
#   nfpm package --packager deb      --config packaging/nfpm.yaml --target dist/evans.deb
#   nfpm package --packager rpm      --config packaging/nfpm.yaml --target dist/evans.rpm
#   nfpm package --packager archlinux --config packaging/nfpm.yaml --target dist/evans.pkg.tar.zst

name: evans
version: ${VERSION}
arch: ${ARCH}
section: devel
priority: optional
vendor: gtors
maintainer: Andrey Torsunov <andrey.torsunov@gmail.com>
homepage: https://github.com/gtors/evans-rs
license: MIT
description: |
  evans is a universal gRPC client. It has an interactive REPL mode and a
  UNIX-friendly CLI mode that reads JSON from stdin and prints JSON to stdout.
  IDL sources are taken from local .proto files or from gRPC server reflection.

contents:
  - src: dist/bin/evans
    dst: /usr/bin/evans
    file_info:
      mode: 0755
  - src: dist/share/README.md
    dst: /usr/share/doc/evans/README.md
    file_info:
      mode: 0644
  - src: dist/share/LICENSE
    dst: /usr/share/doc/evans/LICENSE
    file_info:
      mode: 0644
  - src: dist/share/LICENSE
    dst: /usr/share/licenses/evans/LICENSE
    file_info:
      mode: 0644

overrides:
  deb:
    depends:
      - libc6
      - libgcc-s1
  rpm:
    depends:
      - glibc
      - libgcc
    rpm:
      group: Development/Tools
      summary: Universal gRPC client
  archlinux:
    depends:
      - glibc
      - gcc-libs
    archlinux:
      pkgbase: evans
      packager: gtors
